services:
  # ── TaurusDB / GaussDB (MySQL-compatible locally) ──────────────────────────
  # Work Breakdown: SQL Server → GaussDB distributed database
  # Production: Replace this container with a Huawei Cloud TaurusDB (GaussDB for MySQL)
  #   connection string. TaurusDB is binary-compatible with MySQL 8.0, so Pomelo EF Core
  #   works unchanged. Enable SSL and dual-cluster HA for production (RPO = 0).
  mysql:
    image: mysql:8.0
    container_name: gridguard_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ChangeMe_InProduction!}
      MYSQL_DATABASE: gridguard
      MYSQL_USER: gridguard_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMe_InProduction!}
    ports:
      - "3306:3306"
    volumes:
      - gridguard_mysql_data:/var/lib/mysql
      - ./Infrastructure/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gridguard_user", "-pChangeMe_InProduction!" ]
      interval: 10s
      retries: 5

  # ── MQTT Broker (local dev) ────────────────────────────────────────────────
  # Work Breakdown: Celery → ROMA Connect message queuing
  # Production: Replace Mosquitto with Huawei IoTDA (Device Access) for
  #   enterprise MQTT with TLS, device certificates, and ROMA Connect integration.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gridguard_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./Infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ── .NET Backend → ServiceStage / CCE ─────────────────────────────────────
  # Work Breakdown: IIS → CCE with Kubernetes; .NET Core → ServiceStage
  # Production: Push this image to Huawei SWR (Software Repository for Container)
  #   then deploy to CCE via a Kubernetes Deployment + Service manifest (see
  #   Infrastructure/cce-deployment.yaml).
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gridguard_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Production
      # TaurusDB connection — swap with your Huawei Cloud TaurusDB endpoint in prod
      - ConnectionStrings__TaurusDB=Server=mysql;Port=3306;Database=gridguard;Uid=gridguard_user;Pwd=${DB_PASSWORD:-ChangeMe_InProduction!};SslMode=None;CharSet=utf8mb4;
      - Mqtt__Server=mosquitto
      - Mqtt__Port=1883
      # Security: Huawei DEW — set these from your DEW KMS in production
      - Jwt__Secret=${JWT_SECRET:-GridGuardAI_SuperSecret_Replace_With_DEW_Managed_Key!}
      - Jwt__Issuer=GridGuardAI
      # Huawei Cloud services
      - HuaweiCloud__OBS__AccessKey=${HUAWEI_AK:-}
      - HuaweiCloud__OBS__SecretKey=${HUAWEI_SK:-}
      - HuaweiCloud__OBS__Endpoint=${HUAWEI_OBS_ENDPOINT:-obs.ap-southeast-3.myhuaweicloud.com}
      - HuaweiCloud__OBS__BucketName=${HUAWEI_OBS_BUCKET:-gridguard-evidence-za}
      - HuaweiCloud__ModelArts__InferenceEndpoint=${MODELARTS_ENDPOINT:-}
      - HuaweiCloud__ModelArts__ApiToken=${MODELARTS_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── Python AI Microservice → ModelArts / CCE ───────────────────────────────
  # Work Breakdown: Django/Flask → ModelArts with Python runtime
  #                 TensorFlow/PyTorch → MindSpore AI framework
  # Production: Deploy this service to Huawei ModelArts as a custom runtime
  #   inference endpoint, or containerise and run on CCE alongside the backend.
  microservice:
    build:
      context: ./Microservice
      dockerfile: Dockerfile
    container_name: gridguard_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      # ModelArts endpoint called by TheftService.cs — set for cloud inference
      - MODELARTS_ENDPOINT=${MODELARTS_ENDPOINT:-}
      - MODELARTS_TOKEN=${MODELARTS_TOKEN:-}
    depends_on:
      - backend

  # ── Next.js Frontend → Docker / CAE ────────────────────────────────────────
  # Work Breakdown: Vercel/Netlify → Docker container
  # Production: Can be deployed to Huawei CAE or simply run via Docker on ECS.
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: gridguard_ui
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  gridguard_mysql_data:
