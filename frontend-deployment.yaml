apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridguard-frontend
  namespace: gridguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gridguard-frontend
  template:
    metadata:
      labels:
        app: gridguard-frontend
    spec:
      imagePullSecrets:
      - name: default-secret
      containers:
      - name: frontend
        image: swr.ap-southeast-3.myhuaweicloud.com/gridguard/gridguard-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://159.138.82.160"
        - name: NEXT_PUBLIC_HUAWEI_CLIENT_ID
          value: "gridguard-app"
        - name: NEXT_PUBLIC_HUAWEI_AUTH_URL
          value: "https://oauth-login.cloud.huawei.com/oauth2/v3/authorize"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gridguard-frontend-svc
  namespace: gridguard
  annotations:
    kubernetes.io/elb.class: union
    kubernetes.io/elb.autocreate: '{"type":"public","bandwidth_name":"gridguard-frontend-bandwidth","bandwidth_chargemode":"bandwidth","bandwidth_size":5,"bandwidth_sharetype":"PER","eip_type":"5_bgp"}'
spec:
  type: LoadBalancer
  selector:
    app: gridguard-frontend
  ports:
  - port: 80
    targetPort: 3000
