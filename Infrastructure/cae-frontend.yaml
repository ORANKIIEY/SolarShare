# ─────────────────────────────────────────────────────────────────────────────
# GridGuard AI — Frontend Hosting on Huawei Cloud Application Engine (CAE)
# Work Breakdown: Vercel/Netlify → CAE static hosting
#
# CAE hosts the Next.js frontend as a containerised application.
# This is the production-equivalent of `next start` or `npm run start`.
#
# How to deploy:
#   1. Build the frontend Docker image:
#        cd Frontend
#        docker build -t swr.ap-southeast-3.myhuaweicloud.com/<org>/gridguard-frontend:latest .
#        docker push swr.ap-southeast-3.myhuaweicloud.com/<org>/gridguard-frontend:latest
#
#   2. In Huawei CAE console:
#        - Create Application → "gridguard-frontend"
#        - Component type: Container image (from SWR)
#        - Image: swr.ap-southeast-3.myhuaweicloud.com/<org>/gridguard-frontend:latest
#        - Port: 3000
#        - Environment variables: see below
#        - Enable "External access" → attach to your ELB with WAF
#
#   3. Optional: For purely static export (`next export`), use OBS Static Website:
#        next build && next export
#        Upload ./out to OBS bucket with "Static website hosting" enabled
#        Configure Huawei CDN to serve the OBS bucket (CNAME your domain)
#        This is the lightest-weight approach for the frontend.
#
# Security:
#   - CAE runs inside the same VPC as CCE — no public pod IPs
#   - Huawei WAF attached to the ELB that fronts CAE
#   - All env vars injected at runtime; no secrets in Docker image
# ─────────────────────────────────────────────────────────────────────────────

app_name: gridguard-frontend
region: ap-southeast-3          # Johannesburg
runtime: Container

image: swr.ap-southeast-3.myhuaweicloud.com/<org>/gridguard-frontend:latest

port: 3000
replicas: 2

environment:
  # Backend API hosted on CCE — internal CLB URL (no public exposure)
  NEXT_PUBLIC_API_URL: "https://api.gridguard.huaweicloud.com"

  # Huawei IAM OAuth — Work Breakdown: Auth0 → IAM with MFA
  NEXT_PUBLIC_HUAWEI_CLIENT_ID: "<appgallery-connect-client-id>"
  NEXT_PUBLIC_HUAWEI_AUTH_URL: "https://oauth-login.cloud.huawei.com/oauth2/v3/authorize"

  # Node.js production mode
  NODE_ENV: "production"
  PORT: "3000"

# Auto-scaling — Work Breakdown: Set up auto-scaling policies
scaling:
  min_replicas: 2
  max_replicas: 8
  cpu_threshold: 65

# Health check
health_check:
  path: /api/health
  port: 3000
  interval: 30s
