# GridGuard AI — MQTT Broker Configuration (LOCAL DEV ONLY)
#
# Work Breakdown: Celery → ROMA Connect message queuing
#                 Zero Trust Architecture — no anonymous connections in production
#
# Production: Replace this Mosquitto instance with Huawei IoTDA (Device Access):
#   - Endpoint: iot-{project-id}.iot-mqtts.{region}.myhuaweicloud.com:8883
#   - Authentication: X.509 device certificates (issued by IoTDA CA)
#   - TLS 1.3 enforced; no plain-text port exposed
#   - Topics forwarded to ROMA Connect for event streaming
#
# Local dev: password file used to enforce credentials (no anonymous access)

listener 1883
# allow_anonymous true   # DISABLED — violates Zero Trust policy
# Use a password file for local dev:
password_file /mosquitto/config/passwd
allow_anonymous false

listener 9001
protocol websockets
password_file /mosquitto/config/passwd
allow_anonymous false
